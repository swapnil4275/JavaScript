<!-- Demonstrate DOM Atrribute Changing  -->

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <meta charset="utf-8">

    <title>DOM Changing Attribute</title>
</head>

<body>

    <img id="id1" src="../JavaScript/images/service3.jpg" alt="img1" width="900" height="500">

    <button onclick="changeimg()">change image.</button>


    <!-- JavaScript Code  -->
    <script>
        function changeimg() {

            document.getElementById("id1").src = "../JavaScript/images/DevMinds.png";
        }
    </script>

</body>

</html>
