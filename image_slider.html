<!-- Image Slider  -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Image Slider</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: #e8ecf1;
        }

        .slider-box {
            width: 600px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        img {
            width: 100%;
            height: 350px;
            border-radius: 10px;
            object-fit: cover;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: royalblue;
            color: white;
            transition: 0.1s;
        }

        button:hover {
            background-color: darkblue;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="slider-box">

        <h1>Image Slider</h1>

        <img id="slider" alt="">

        <div class="buttons">

            <button onclick="previousImage()">
                << Previous
            </button>

            <button onclick="nextImage()">
                Next >>
            </button>

        </div>

    </div>

    <script>

        const images = [

            "../JavaScript/images/tech.jpg",

            "../JavaScript/images/service1.png",

            "../JavaScript/images/service3.jpg",

            "../JavaScript/images/service2.webp"

        ];

        let index = 0;

        document.getElementById("slider").src = images[index];

        function nextImage() {

            index++;

            if (index >= images.length) {

                index = 0;
            }

            document.getElementById("slider").src = images[index];
        }

        function previousImage() {

            index--;

            if (index < 0) {

                index = images.length - 1;
            }

            document.getElementById("slider").src = images[index];
        }

    </script>

</body>

</html>
