<!-- Demonstrate DOM Element query selector All (.querySelectorAll())  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>DOM querySelectorAll</title>
</head>

<body>

    <p class="demo">This is 1st line..</p>

    <p class="demo">This is 2nd line..</p>

    <p class="demo">This is 3rd line..</p>



    <!-- JavaScript Code  -->
    <script>

        let x = document.querySelectorAll(".demo");

        x[0].style.color = "red";
        x[1].style.color = "red";
        x[2].style.fontWeight = "bold";

    </script>

</body>


</html>
