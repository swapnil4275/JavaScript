<!-- Demonstrate Timing Event. (setInterval && clearInterval)  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>setInterval & clearInterval Events</title>
</head>

<body>

    <button onclick="start()">Start</button>

    <button onclick="Stop()">Stop</button>



    <script>

        let x;

        function start() {

            x = setInterval(show, 3000);
        }

        function show() {

            alert("Are You Ok..?");
        }

        function stop() {

            clearInterval(x);
            
        }

    </script>

</body>

</html>
