<!-- Demonstrate load events (onload)  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>Load Events</title>
</head>

<body onload="welcome()">

    <h1>My  Website.</h1>


    <script>
        function welcome(){

            alert("page loaded successesfully !")
        }
    </script>

</body>

</html>
