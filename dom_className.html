<!-- Demonstrate DOM Elements By Class Name  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0";>

    <title>DOM ClassName</title>
</head>

<body>

    <p class="demo">Hello All..!</p>

    <p class="demo">Good Afternoon..</p>

    <p class="demo">What's Up!</p>

    <p id="demo1"></p>


    <!-- JavaScript Code  -->
    <script>

        let class1 = document.getElementsByClassName("demo");

        document.getElementById("demo1").innerHTML = class1[0].innerHTML + " , " + class1[1].innerHTML;

    </script>

</body>

</html>
