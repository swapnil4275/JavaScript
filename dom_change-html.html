<!-- Demonstrate DOM Changing HTML  -->

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">
    <meta charset="utf-8">

    <title>DOM Change HTML</title>
</head>

<body>

    <h4>JavaScript can change HTML.</h4>

    <p id="change">Hello World..!</p>


    <!-- JavaScript Code  -->
    <script>
        document.getElementById("change").innerHTML = "New Text..!!"
    </script>

    <p>The paragraph above was changed by a script.</p>

</body>

</html>
