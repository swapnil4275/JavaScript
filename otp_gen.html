<!-- Random OTP Generator  -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 120px;
            background-color: rgb(244, 244, 244);
        }

        .box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            background-color: royalblue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>OTP Generator</h1>

        <button onclick="generateOTP()">
            Generate OTP
        </button>

        <div id="result">
            Your OTP is: 
        </div>

    </div>

    <script>

        function generateOTP() {

            let otp = Math.floor(100000 + Math.random() * 900000);

            document.getElementById("result").innerHTML =
                "Your OTP is: " + otp;
        }

    </script>

</body>

</html>
