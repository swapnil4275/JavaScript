<!-- Demonstrate load events (onunload)  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>unload Events</title>
</head>

<body onload="byy()">

    <h1>close this page.</h1>


    <script>
        function byy(){

            alert("thanks for visiting..!");
        }
    </script>

</body>

</html>
