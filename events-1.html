<!-- Demonstrate Events Basic Syntax  -->

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>Events</title>
</head>
    
<body>

    <button onclick="show()">Click Me..!</button>

    <script>
        function show(){

            alert("Button Clicked..!");
        }
    </script>

</body>

</html>
