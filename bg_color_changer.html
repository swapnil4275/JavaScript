<!-- Background Colour Changer  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(244, 244, 244);
            transition: 0.5s;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 0px 15px gray;
            width: 400px;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .btn-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        .random {
            background-color: black;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Background Color Changer</h1>

        <div class="btn-box">

            <button class="red" onclick="redColor()">
                Red
            </button>

            <button class="green" onclick="greenColor()">
                Green
            </button>

            <button class="blue" onclick="blueColor()">
                Blue
            </button>

            <button class="random" onclick="randomColor()">
                Random
            </button>

        </div>

    </div>

    <script>

        function redColor() {

            document.body.style.backgroundColor = "red";
        }

        function greenColor() {

            document.body.style.backgroundColor = "green";
        }

        function blueColor() {

            document.body.style.backgroundColor = "blue";
        }

        function randomColor() {

            let r = Math.floor(Math.random() * 256);

            let g = Math.floor(Math.random() * 256);

            let b = Math.floor(Math.random() * 256);

            let color = "rgb(" + r + "," + g + "," + b + ")";

            document.body.style.backgroundColor = color;
        }

    </script>

</body>

</html>
